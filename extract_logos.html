<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extract Visaka Logos</title>
  <style>
    body { font-family: sans-serif; background: #333; color: white; padding: 20px; }
    canvas { border: 1px solid #666; margin: 10px 0; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10" fill="%23444"/><rect x="10" y="10" width="10" height="10" fill="%23444"/><rect x="10" width="10" height="10" fill="%23555"/><rect y="10" width="10" height="10" fill="%23555"/></svg>'); }
    .preview-box { display: inline-block; margin: 10px; text-align: center; }
  </style>
</head>
<body>
  <h1>Visaka Logo Transparent Generator</h1>
  <div id="status">Loading source image...</div>
  <div id="container"></div>

  <script>
    const img = new Image();
    img.src = 'src/assets/logo/Visaka Paints Logo.jpg.jpeg';
    
    img.onload = () => {
      document.getElementById('status').innerText = `Image loaded: ${img.naturalWidth} x ${img.naturalHeight}`;
      
      const fullCanvas = document.createElement('canvas');
      fullCanvas.width = img.naturalWidth;
      fullCanvas.height = img.naturalHeight;
      const ctx = fullCanvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      
      // Top half: 0 to h * 0.5
      // Bottom half: h * 0.5 to h
      processRegion(ctx, 0, 0, w, Math.floor(h * 0.48), 'visaka_paints_logo');
      processRegion(ctx, 0, Math.floor(h * 0.52), w, Math.floor(h * 0.48), 'visaka_chemicals_logo');
    };

    img.onerror = (e) => {
      document.getElementById('status').innerText = 'Error loading image: ' + e.message;
    };

    function processRegion(srcCtx, rx, ry, rw, rh, name) {
      const regionData = srcCtx.getImageData(rx, ry, rw, rh);
      const data = regionData.data;

      // First pass: find bounding box of non-white content
      let minX = rw, minY = rh, maxX = 0, maxY = 0;

      for (let y = 0; y < rh; y++) {
        for (let x = 0; x < rw; x++) {
          const idx = (y * rw + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];

          // Check if not white background
          const isBg = (r > 245 && g > 245 && b > 245);
          if (!isBg) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      // Add padding
      const pad = 20;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(rw - 1, maxX + pad);
      maxY = Math.min(rh - 1, maxY + pad);

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      // Create destination canvas
      const outCanvas = document.createElement('canvas');
      outCanvas.width = cropW;
      outCanvas.height = cropH;
      outCanvas.id = name;
      const outCtx = outCanvas.getContext('2d');
      const outImgData = outCtx.createImageData(cropW, cropH);

      // Copy and remove white background with alpha un-premultiplication
      for (let y = 0; y < cropH; y++) {
        for (let x = 0; x < cropW; x++) {
          const srcIdx = ((minY + y) * rw + (minX + x)) * 4;
          const dstIdx = (y * cropW + x) * 4;

          const r = data[srcIdx];
          const g = data[srcIdx + 1];
          const b = data[srcIdx + 2];

          // Calculate lightness or distance from white (255, 255, 255)
          // For red (high r, low g,b), min(g,b) is low (~30).
          // For blue (low r, mid g, high b), min(r,g) is low (~30-60).
          // For white, min(r,g,b) ~ 255.
          // Alpha is determined by how far away it is from white.
          const diffR = 255 - r;
          const diffG = 255 - g;
          const diffB = 255 - b;
          
          // Euclidean distance from white in RGB space (max dist from white to black is ~441.67)
          const dist = Math.sqrt(diffR * diffR + diffG * diffG + diffB * diffB);
          
          if (dist < 12) {
            // Pure white background
            outImgData.data[dstIdx] = 0;
            outImgData.data[dstIdx + 1] = 0;
            outImgData.data[dstIdx + 2] = 0;
            outImgData.data[dstIdx + 3] = 0;
          } else {
            // Anti-aliasing alpha calculation
            let alpha = 1.0;
            if (dist < 80) {
              alpha = (dist - 12) / (80 - 12);
            }
            
            // Alpha de-contamination (unpremultiply white)
            // C_orig = (1-a)*255 + a*C_fg  =>  C_fg = (C_orig - 255*(1-a)) / a
            const aClamp = Math.max(alpha, 0.05);
            let fgR = (r - 255 * (1 - alpha)) / aClamp;
            let fgG = (g - 255 * (1 - alpha)) / aClamp;
            let fgB = (b - 255 * (1 - alpha)) / aClamp;

            outImgData.data[dstIdx] = Math.min(255, Math.max(0, Math.round(fgR)));
            outImgData.data[dstIdx + 1] = Math.min(255, Math.max(0, Math.round(fgG)));
            outImgData.data[dstIdx + 2] = Math.min(255, Math.max(0, Math.round(fgB)));
            outImgData.data[dstIdx + 3] = Math.min(255, Math.max(0, Math.round(alpha * 255)));
          }
        }
      }

      outCtx.putImageData(outImgData, 0, 0);

      const wrapper = document.createElement('div');
      wrapper.className = 'preview-box';
      wrapper.innerHTML = `<h3>${name} (${cropW}x${cropH})</h3>`;
      wrapper.appendChild(outCanvas);

      const btn = document.createElement('button');
      btn.innerText = 'Copy Base64';
      btn.onclick = () => {
        navigator.clipboard.writeText(outCanvas.toDataURL('image/png'));
        alert('Copied!');
      };
      wrapper.appendChild(document.createElement('br'));
      wrapper.appendChild(btn);

      // Also store dataURL in a hidden textarea with predictable id for extraction
      const ta = document.createElement('textarea');
      ta.id = name + '_data';
      ta.value = outCanvas.toDataURL('image/png');
      ta.style.display = 'none';
      wrapper.appendChild(ta);

      document.getElementById('container').appendChild(wrapper);
    }
  </script>
</body>
</html>
